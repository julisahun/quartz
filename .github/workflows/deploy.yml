name: Deploy quartz to the Pi

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - server/**
      - web/**
      - .github/workflows/deploy.yml

concurrency:
  group: pi-quartz-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PI_HOST: sigint          # Tailscale MagicDNS name of the Pi
      PI_USER: sigint
      PI_DIR: /opt/quartz
      SERVICE: quartz

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Test the server
        working-directory: server
        run: go test ./...

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test and build the PWA
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Cross-compile for the Pi (linux/arm64)
        working-directory: server
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../bin
          go build -trimpath -o ../bin/quartz .
          go build -trimpath -o ../bin/quartz-admin ./cmd/quartz-admin
          go build -trimpath -o ../bin/quartz-passwd ./cmd/quartz-passwd
          go build -trimpath -o ../bin/quartzctl ./cmd/quartzctl

      - name: Connect to tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check the tailnet path to the Pi
        run: |
          # Two different failures look identical from the rsync step, which
          # just dies with "Could not resolve hostname". Tell them apart here.
          if ! tailscale status >/dev/null 2>&1; then
            echo "::error::the runner never joined the tailnet — check TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET (a bad value fails with 401 API token invalid when minting the auth key)"
            tailscale status || true
            exit 1
          fi
          if ! tailscale ip -4 "$PI_HOST" >/dev/null 2>&1; then
            echo "::error::joined the tailnet but $PI_HOST is not visible — check the machine is up, tagged tag:server, and that the ACL allows tag:ci to reach it"
            tailscale status || true
            exit 1
          fi
          echo "$PI_HOST is $(tailscale ip -4 "$PI_HOST")"

      - name: Ship the binaries
        run: |
          rsync -az --chmod=F0755 \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            bin/quartz bin/quartz-admin bin/quartz-passwd bin/quartzctl \
            "$PI_USER@$PI_HOST:$PI_DIR/"

      - name: Ship the PWA
        run: |
          rsync -a --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            web/dist/ "$PI_USER@$PI_HOST:$PI_DIR/web/"

      - name: Restart and smoke test
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$PI_USER@$PI_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          sudo systemctl restart quartz
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8086/healthz >/dev/null; then
              # The API answering is not enough on its own: a deploy that
              # shipped a broken web root would still pass that check.
              if curl -sf http://127.0.0.1:8086/ | grep -q 'id="root"'; then
                echo "quartz is up and serving the app"
                exit 0
              fi
              echo "the API is up but the app shell is missing" >&2
              exit 1
            fi
            sleep 1
          done
          echo "quartz did not come up" >&2
          sudo journalctl -u quartz -n 40 --no-pager >&2
          exit 1
          REMOTE
